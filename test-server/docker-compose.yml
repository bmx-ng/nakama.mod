services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - nakama-test-data:/var/lib/postgresql/data

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama
        exec /nakama/nakama \
          --name nakama-bmx-test \
          --database.address postgres:localdb@postgres:5432/nakama \
          --logger.level INFO \
          --session.token_expiry_sec 7200
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:7349:7349"
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"

volumes:
  nakama-test-data:
